default_policy: deny
raw_data_write: false
allowed_capabilities:
  - system.status
  - filesystem.inspect
  - filesystem.read
  - filesystem.write
  - workspace.list
  - job.list
  - job.status
  - job.result
  - job.logs
  - job.cancel
  - job.submit_healthcheck
  - das.inspect
  - das.read
  - das.process
  - das.plot
denied_capabilities:
  - delete
  - recursive_delete
  - arbitrary_shell
  - arbitrary_ssh
