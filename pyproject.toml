[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geomcp"
version = "0.1.0"
description = "Safe geophysics research services for Python, CLI and MCP clients"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
geomcp = "geomcp.cli.main:main"
geomcp-mcp = "geomcp.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
